name: Build and Publish Docker image to GHCR

# The image is built on every commit to any branch, and on a v* tag.
#   every branch : ghcr.io/nih-nlm/cellxgene-harvester:<branch name> and :sha-<commit>
#   main         : also :latest and :<version of pyproject.toml>, for example :1.0.0
#   tag v1.0     : :1.0
on:
  push:
    branches: [ '**' ]
    tags:    [ 'v*' ]
  workflow_dispatch:      # also manual (Actions tab > Run workflow)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the version
        id: version
        run: echo "value=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nih-nlm/cellxgene-harvester
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
