[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellxgene-harvester"
version = "1.0.0"
description = "Harvest, filter, and count normal cells from CellxGene Census using UBERON ontology-based tissue filtering"
authors = [
    { name = "Anne Deslattes Mays" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
    "typer[all]",
    "fastmcp",
]

[project.optional-dependencies]
cloudos = ["cloudos-cli"]

[project.scripts]
cellxgene-harvester = "harvester.cli:main"
cellxgene-harvester-mcp = "harvester.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
