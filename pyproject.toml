[project]
name = "cellxgene-harvester"
version = "1.0.0"
description = "Harvest, filter, and count normal cells from CellxGene Census using ontology-based filtering (UBERON, PATO/MONDO, HsapDv)"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Anne Deslattes Mays, PhD", email = "adeslat@scitechcon.org" }
]
requires-python = ">=3.10"

dependencies = [
    "pandas>=1.5",
    "requests>=2.28",
    "typer[all]>=0.9",
    "cellxgene-census>=1.15",
    "tiledbsoma>=1.12",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cellxgene-harvester = "harvester.cli:main"
