[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cellxgene-harvester"
version = "1.0.0"
description = "Harvest, filter, and count normal cells from CellxGene Census using UBERON ontology-based tissue filtering"
authors = [
    { name = "Anne Deslattes Mays", email = "anne.deslattes.mays@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]
